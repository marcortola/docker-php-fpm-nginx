name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
  # Weekly rebuild so published tags pick up routine upstream php:*-fpm-alpine and Alpine package
  # updates without waiting for a commit. security-watch.yml dispatches this workflow as soon as a
  # security fix is available.
  schedule:
    - cron: '17 2 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

# Documentation-only PRs retain successful validation jobs without running toolchains or tests.
# Dependency, source and workflow edits always run the complete gate.
jobs:
  test_main:
    name: Test MAIN
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [ base, debug ]
        php: [ 8.2, 8.5 ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Select validation scope
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # checkout uses the synthetic PR merge; its first parent is the target branch.
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/ci-changes"
          run=false
          changed=false
          while IFS= read -r -d '' path; do
            changed=true
            case "$path" in
              README.md|AGENTS.md|CLAUDE.md|docs/*.md) ;;
              *) run=true ;;
            esac
          done < "$RUNNER_TEMP/ci-changes"
          if [ "$changed" = false ]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = false ]; then
            echo 'Documentation-only change; validation check remains successful.'
          fi

      - name: Set up QEMU
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changes.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      # Single-arch (host = amd64) so the image can be --load'ed and health-checked below.
      - name: Build
        if: steps.changes.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: PHP_VERSION=${{ matrix.php }}
          tags: php-fpm-nginx:ci
          load: true
          # Scheduled and dispatched rebuilds skip the layer cache so apk packages and the
          # php-extension-installer layers refresh. The push step reuses these amd64 layers from the
          # builder's local cache and skips the gha cache on the same events (see there).
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }}
          cache-to: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }},mode=max

      - name: Start Container with Health Check
        if: steps.changes.outputs.run == 'true'
        run: |
          docker run -d --rm \
            --name test \
            -p 10000:80 \
            --health-cmd "/usr/local/bin/healthcheck.sh" \
            --health-interval=30s \
            --health-timeout=30s \
            --health-start-period=60s \
            --health-start-interval=1s \
            php-fpm-nginx:ci

      - name: Wait for container
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 1
        run: |
          while status="$(docker inspect -f '{{ .State.Health.Status }}' test)"; do
            case $status in
              starting) sleep 1;;
              healthy) exit 0;;
              unhealthy) exit 1;;
            esac
          done
          exit 1

      - name: Test
        if: steps.changes.outputs.run == 'true'
        run: |
          curl http://localhost:10000

          # Root mode renders the non-root switches as before: the pid under /var/run, the fpm
          # socket chowned to www-data and nginx's compiled-in temp paths. Rendering again by
          # hand, outside the entrypoint, must give the same lines.
          check_root_render() {
            for line in 'pid /var/run/nginx.pid;' '    fastcgi_temp_path /var/run/fastcgi-cache/;'; do
              docker exec test grep -qxF "$line" /etc/nginx/nginx.conf || { echo "nginx.conf lacks '$line'"; exit 1; }
            done
            if docker exec test grep -E '^ *(client_body|proxy|uwsgi|scgi)_temp_path' /etc/nginx/nginx.conf; then
              echo 'nginx.conf overrides a compiled-in temp path'; exit 1
            fi
            for line in 'listen.owner = www-data' 'listen.group = www-data'; do
              docker exec test grep -qxF "$line" /usr/local/etc/php-fpm.d/zzzz-docker.conf || { echo "zzzz-docker.conf lacks '$line'"; exit 1; }
            done
          }
          check_root_render
          docker exec test /usr/local/bin/docker-entrypoint.d/20-auto-envsubst.sh
          check_root_render

      # Non-root mode, as consumers run their dev containers: an arbitrary uid with group 0
      # added and the project bind-mounted at /var/www. Reuses the image loaded above.
      - name: Test non-root mode
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 2
        run: |
          www="$RUNNER_TEMP/nonroot-www"
          mkdir -p "$www"
          cat > "$www/nonroot-test.php" <<'PHP'
          <?php
          $body = file_get_contents('php://input');
          file_put_contents(__DIR__ . '/written-by-php.txt', 'written');
          header('Content-Type: application/octet-stream');
          echo $_SERVER['REQUEST_METHOD'] === 'POST' ? str_repeat($body, 16) : 'php-ok';
          PHP
          cat > "$RUNNER_TEMP/nonroot-test.conf" <<'NGINX'
          root /var/www;
          location = /nonroot-test.php {
              # Logs the temp file nginx buffers each spilled body to, checked below.
              error_log /dev/stderr warn;
              include fastcgi_params;
              fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
              fastcgi_pass $default_fastcgi_pass;
          }
          NGINX
          # The runner user is not uid 1000; hand the mount to the uid the container runs as.
          sudo chown -R 1000:1000 "$www"

          trap 'status=$?; [ "$status" -eq 0 ] || docker logs test-nonroot; docker rm -f test-nonroot > /dev/null; exit "$status"' EXIT
          # --volumes-from mounts the root container's /var/lib/nginx/tmp volume, which its
          # 00-init.sh chowned to www-data with mode 755, as a container switched from root to
          # non-root mode keeps it.
          docker run -d \
            --name test-nonroot \
            --user 1000:1000 \
            --group-add 0 \
            -p 10001:80 \
            --volumes-from test \
            -v "$www:/var/www" \
            -v "$RUNNER_TEMP/nonroot-test.conf:/etc/nginx/server-default/nonroot-test.conf:ro" \
            --health-cmd "/usr/local/bin/healthcheck.sh" \
            --health-interval=30s \
            --health-timeout=30s \
            --health-start-period=60s \
            --health-start-interval=1s \
            php-fpm-nginx:ci

          while status="$(docker inspect -f '{{ .State.Health.Status }}' test-nonroot)"; do
            case $status in
              starting) sleep 1;;
              healthy) break;;
              *) echo "container is $status"; exit 1;;
            esac
          done
          [ "$status" = healthy ]

          # Every process runs as the requested uid.
          users="$(docker exec test-nonroot ps -o user= | sort -u)"
          [ "$users" = 1000 ] || { echo "processes run as: $users"; exit 1; }

          # Non-root mode renders the pid and nginx's temp paths under /tmp, the fastcgi temp
          # path as in root mode, and no chown of the fpm socket. Rendering again by hand,
          # outside the entrypoint, must give the same lines, and nginx and php-fpm must
          # restart with them; the requests below then run on the restarted programs.
          check_nonroot_render() {
            for line in 'pid /tmp/nginx.pid;' \
              '    client_body_temp_path /tmp/nginx/client_body;' \
              '    proxy_temp_path /tmp/nginx/proxy;' \
              '    uwsgi_temp_path /tmp/nginx/uwsgi;' \
              '    scgi_temp_path /tmp/nginx/scgi;' \
              '    fastcgi_temp_path /var/run/fastcgi-cache/;'; do
              docker exec test-nonroot grep -qxF "$line" /etc/nginx/nginx.conf || { echo "nginx.conf lacks '$line'"; exit 1; }
            done
            if docker exec test-nonroot grep -E '^ *listen\.(owner|group)' /usr/local/etc/php-fpm.d/zzzz-docker.conf; then
              echo 'zzzz-docker.conf chowns the fpm socket'; exit 1
            fi
          }
          check_nonroot_render
          docker exec test-nonroot /usr/local/bin/docker-entrypoint.d/20-auto-envsubst.sh
          check_nonroot_render
          for program in nginx php-fpm; do
            restarted="$(docker exec test-nonroot supervisorctl -c /etc/supervisord-nonroot.conf restart "$program")"
            [ "$restarted" = "$(printf '%s: stopped\n%s: started' "$program" "$program")" ] || { echo "restarting $program: $restarted"; exit 1; }
          done
          healthy=false
          for _ in $(seq 30); do
            if docker exec test-nonroot /usr/local/bin/healthcheck.sh > /dev/null; then healthy=true; break; fi
            sleep 1
          done
          [ "$healthy" = true ] || { echo 'the health check fails after the restart'; exit 1; }

          [ "$(curl --silent --fail http://localhost:10001/nonroot-test.php)" = php-ok ]

          # The 512 KiB body is larger than client_body_buffer_size (16k), so nginx buffers it to
          # a temp file. PHP echoes it 16 times; the socket buffers on the way to curl absorb a
          # 512 KiB response, but 8 MiB read at 2 MB/s fills the fastcgi buffers, so nginx also
          # buffers the response to $NGINX_FASTCGI_TMP_DIR.
          head -c 524288 /dev/urandom > "$RUNNER_TEMP/nonroot-body"
          curl --silent --fail --limit-rate 2M \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$RUNNER_TEMP/nonroot-body" \
            -o "$RUNNER_TEMP/nonroot-echo" \
            http://localhost:10001/nonroot-test.php
          expected="$(for _ in $(seq 16); do cat "$RUNNER_TEMP/nonroot-body"; done | md5sum)"
          actual="$(md5sum < "$RUNNER_TEMP/nonroot-echo")"
          [ "$actual" = "$expected" ] || { echo "POST echo has md5 $actual, expected $expected"; exit 1; }
          # Both bodies did spill, to the non-root temp paths: a matching echo alone does not
          # show it, since socket buffers can absorb the response.
          logs="$(docker logs test-nonroot 2>&1)"
          for message in 'a client request body is buffered to a temporary file /tmp/nginx/client_body/' \
            'an upstream response is buffered to a temporary file /var/run/fastcgi-cache/'; do
            grep -qF "$message" <<< "$logs" || { echo "nginx did not log '$message'"; exit 1; }
          done

          # The bind mount holds only the test page and the file PHP wrote, and nothing in it
          # belongs to root or www-data (82).
          files="$(find "$www" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tr '\n' ' ')"
          [ "$files" = 'nonroot-test.php written-by-php.txt ' ] || { echo "bind mount holds: $files"; exit 1; }
          foreign="$(find "$www" ! -uid 1000)"
          [ -z "$foreign" ] || { echo "not owned by uid 1000:"; find "$www" ! -uid 1000 -exec ls -lnd {} +; exit 1; }

          # The entrypoint swaps /etc/supervisord.conf for the non-root config in each spelling
          # of -c, and only in non-root mode. A stub supervisord earlier in PATH prints the
          # arguments it receives.
          printf '#!/bin/sh\necho "$*"\n' > "$RUNNER_TEMP/print-args"
          chmod 755 "$RUNNER_TEMP/print-args"
          check_args() { # user, expected arguments, command
            user=$1 expected=$2
            shift 2
            actual="$(docker run --rm --user "$user" --group-add 0 \
              -v "$RUNNER_TEMP/print-args:/usr/local/sbin/supervisord:ro" \
              php-fpm-nginx:ci "$@" | tail -n 1)"
            [ "$actual" = "$expected" ] || { echo "as $user, '$*' ran supervisord $actual, expected $expected"; exit 1; }
          }
          check_args 1000:1000 '-c /etc/supervisord-nonroot.conf --nodaemon' supervisord -c /etc/supervisord.conf --nodaemon
          check_args 1000:1000 '--configuration /etc/supervisord-nonroot.conf' supervisord --configuration /etc/supervisord.conf
          check_args 1000:1000 '-c/etc/supervisord-nonroot.conf' supervisord -c/etc/supervisord.conf
          check_args 1000:1000 '--configuration=/etc/supervisord-nonroot.conf' supervisord --configuration=/etc/supervisord.conf
          check_args 1000:1000 '-c /var/www/custom.conf' supervisord -c /var/www/custom.conf
          check_args 0:0 '-c /etc/supervisord.conf --nodaemon' supervisord -c /etc/supervisord.conf --nodaemon

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: PHP_VERSION=${{ matrix.php }}
          platforms: linux/amd64,linux/arm64
          tags: marcortola/php-fpm-nginx:${{ matrix.php }}${{ (matrix.target != 'base' && format('-{0}', matrix.target)) || '' }}
          push: true
          # On scheduled and dispatched rebuilds this step does not import the gha cache: amd64 comes
          # from the builder's local cache, so the published image is the one tested above, and
          # linux/arm64, which the amd64-only test build never refreshes, is rebuilt fresh on any
          # branch. Pull requests and pushes keep the gha cache.
          cache-from: ${{ !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('type=gha,scope=php-{0}-{1}', matrix.php, matrix.target) || '' }}
          cache-to: type=gha,scope=php-${{ matrix.php }}-${{ matrix.target }},mode=max

  # The security watch's decision logic runs against fixtures here, since security-watch.yml
  # itself only runs on a schedule or by hand on main. Scheduled and dispatched rebuilds skip it.
  security_watch_tests:
    name: Test security watch
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint scripts
        run: shellcheck -x .github/scripts/*.sh .github/scripts/tests/run.sh .github/scripts/tests/bin/*

      - name: Run fixture tests
        run: .github/scripts/tests/run.sh

  # Aggregates the matrix above into one check with a stable name. The individual legs are
  # named "Test MAIN (base, 8.5)" and so on, so they expand and rename whenever the matrix
  # changes and cannot be listed as required status checks on the branch. This job can, and it
  # also gates the security watch tests, which run only on pull requests and pushes.
  ci-complete:
    needs: [ test_main, security_watch_tests ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every matrix leg succeeded
        if: needs.test_main.result != 'success'
        run: |
          echo "test_main concluded: ${{ needs.test_main.result }}"
          exit 1

      - name: Fail unless the security watch tests passed or were skipped
        if: needs.security_watch_tests.result != 'success' && needs.security_watch_tests.result != 'skipped'
        run: |
          echo "security_watch_tests concluded: ${{ needs.security_watch_tests.result }}"
          exit 1

  # GitHub disables scheduled workflows in public repositories after 60 days without repository
  # activity. Re-enabling the workflow on every scheduled run keeps the weekly rebuild alive.
  keepalive:
    name: Keep schedule enabled
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPOSITORY/actions/workflows/ci.yml/enable"
